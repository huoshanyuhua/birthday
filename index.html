<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff9e9">
<title>HAPPY BIRTHDAY TO 企鹅</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grain"></div>
<header class="nav">
<!-- <a class="wordmark" href="#" aria-label="企鹅生日首页"><span class="mark">18</span><span>PEI · DAY</span></a> -->
  <div class="nav-note">A LITTLE CELEBRATION, JUST FOR YOU</div>
<!--  <button class="soundless" id="surprise">打开惊喜 <span>↗</span></button> -->
</header>
<main class="canvas">
  <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
  <div class="left-copy">
    <div class="overline"><span class="line"></span> OCTOBER · YOUR SPECIAL DAY</div>
    <h1>企鹅，<br><span>Happy Birthday。</span></h1>
    <p class="intro">愿你带着喜欢的一切，<br>慢慢长大，尽情生活。<br>去成为自己想成为的人。</p>
    <button class="celebrate" id="celebrate">MAKE A WISH <span>❋</span></button>
    <div class="tiny-note"><span class="dot"></span> Today is all about you</div>
  </div>
  <div class="character-scene" aria-label="轻松熊朋友们的生日场景">
    <div class="sun"></div>
    <div class="spark spark-a">✼</div><div class="spark spark-b">✧</div><div class="spark spark-c">✦</div>
    <div class="speech">HAPPY<br>BIRTHDAY!</div>
    <div class="number-sticker">18<small>TH</small></div>
    <div class="character chairo"><img src="images/Chairoikoguma.png" alt="茶色小熊 Chairoikoguma"></div>
    <div class="character rilakkuma"><img src="images/Rilakkuma.png" alt="轻松熊 Rilakkuma"></div>
    <div class="character korilakkuma"><img src="images/Korilakkuma.png" alt="熊妹 Korilakkuma"></div>
    <div class="character kiiroitori"><img src="images/Kiiroitori.png" alt="鼻孔鸡 Kiiroitori"></div>
    <div class="cake" aria-hidden="true"><div class="flame"></div><div class="candle"></div><div class="icing"></div><div class="cake-body"><i></i><i></i><i></i></div><div class="plate"></div></div>
    <div class="ground"></div>
    <div class="caption">RILAKKUMA & FRIENDS</div>
  </div>
  <div class="bottom-line"><span>MADE WITH JOY FOR 企鹅</span></div>
</main>
<div class="toast" id="toast" role="status">愿你永远有糖吃，有觉睡，有梦做。</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<script src="script.js"></script>
</body></html>
